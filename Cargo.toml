[package]
name = "abstract-editor"
version = "0.1.4"
edition = "2024"
description = "Minimal local-first markdown notes editor, GPU-rendered with GPUI"
repository = "https://github.com/fireflylabss/abstract"
license = "Apache-2.0"
rust-version = "1.97"
keywords = ["markdown", "notes", "editor", "gpui"]
categories = ["text-editors"]
readme = "README.md"

[[bin]]
name = "abstract"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.3.4", package = "gpui-pre" }
gpui-base = "=0.6.1"
gpui-component = "=0.6.1"
gpui-component-macros = "=0.6.1"
gpui-kit = { version = "=0.6.1", default-features = false, features = ["component", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
gpui-kit-assets = "=0.6.1"
gpui_platform = { version = "=0.3.4", package = "gpui-pre-platform", default-features = false, features = ["wayland", "x11"] }
tree-sitter = "=0.26.13"
notify = "8"
sys-locale = "0.3"
futures = "0.3"
tree-sitter-md = "=0.5.3"
trash = "5"
unicode-segmentation = "1"
unicode-width = "0.2"
minisign-verify = "=0.2.5"
sha2 = "0.10"
arboard = { version = "=3.6.1", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
spellbook = "0.4"

[dev-dependencies]
gpui = { version = "=0.3.4", package = "gpui-pre", features = ["test-support"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
winresource = "=0.1.31"

[package.metadata.deb]
depends = "libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libxcb1, libfontconfig1"
section = "editors"
assets = [
    [
        "target/release/abstract",
        "usr/bin/",
        "755",
    ],
    ["README.md", "usr/share/doc/abstract/README.md", "644"],
    [
        "assets/abstract.desktop",
        "usr/share/applications/abstract.desktop",
        "644",
    ],
    [
        "assets/abstract.png",
        "usr/share/icons/hicolor/512x512/apps/abstract.png",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/abstract", dest = "/usr/bin/abstract", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/abstract/README.md", mode = "644" },
    { source = "assets/abstract.desktop", dest = "/usr/share/applications/abstract.desktop", mode = "644" },
    { source = "assets/abstract.png", dest = "/usr/share/icons/hicolor/512x512/apps/abstract.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
libxcb = "*"
fontconfig = "*"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
