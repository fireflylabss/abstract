[package]
name = "abstract-editor"
version = "0.1.5"
edition = "2024"
description = "Minimal local-first markdown notes editor, GPU-rendered with Rune"
repository = "https://github.com/fireflylabss/abstract"
license = "Apache-2.0"
rust-version = "1.99.1"
keywords = ["markdown", "notes", "editor", "rune"]
categories = ["text-editors"]
readme = "README.md"
publish = false

[[bin]]
name = "abstract"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "33eabc2", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }
tree-sitter = "=0.26.13"
sys-locale = "0.3"
tree-sitter-md = "=0.5.3"
unicode-segmentation = "1"
unicode-width = "0.2"

[build-dependencies]
winresource = "=0.1.31"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "33eabc2" }

[package.metadata.deb]
depends = "libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libxcb1, libfontconfig1"
section = "editors"
assets = [
    [
        "target/release/abstract",
        "usr/bin/",
        "755",
    ],
    ["README.md", "usr/share/doc/abstract/README.md", "644"],
    [
        "assets/abstract.desktop",
        "usr/share/applications/abstract.desktop",
        "644",
    ],
    [
        "assets/abstract.png",
        "usr/share/icons/hicolor/512x512/apps/abstract.png",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/abstract", dest = "/usr/bin/abstract", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/abstract/README.md", mode = "644" },
    { source = "assets/abstract.desktop", dest = "/usr/share/applications/abstract.desktop", mode = "644" },
    { source = "assets/abstract.png", dest = "/usr/share/icons/hicolor/512x512/apps/abstract.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
libxcb = "*"
fontconfig = "*"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
