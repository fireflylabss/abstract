ShortDescription: Minimal local-first markdown notes editor, GPU-rendered with GPUI
Description: >-
  abstract is a minimal, local-first markdown notes editor. Notes are
  plain Markdown files in real folders on disk — the folder is the
  workspace. It features live-rendered Markdown with conceal, wiki-links
  with backlinks, a quick-open palette, multiple spaces, themes and an
  English/Portuguese UI.
