name: preview

on:
  push:
    branches: ['preview/**']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-keysyms1-dev \
            libwayland-dev libasound2-dev libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package
        run: bash scripts/package.sh x86_64-unknown-linux-gnu linux-x86_64 "0.1.5-preview"
      - name: Publish to preview-builds branch
        run: |
          sha="$(git rev-parse --short HEAD)"
          (cd dist && sha256sum * > SHA256SUMS)
          mkdir /tmp/out && cp dist/* /tmp/out/
          cd /tmp/out
          git init -q -b preview-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "preview build ${sha}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-builds
