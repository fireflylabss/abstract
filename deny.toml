[advisories]
yanked = "deny"
# Rune 33eabc2's AccessKit/AT-SPI stack still uses the standalone D-Bus
# crates merged into zbus 6; these require an upstream dependency migration.
ignore = [
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "0BSD",
    "NCSA",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/anomalyco/rune"]
