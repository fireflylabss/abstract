[advisories]
yanked = "deny"
# Unmaintained crates pulled in transitively via pinned gpui-pre/gpui-kit
# versions (= pins); no upgrade is available until upstream updates.
ignore = [
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
    # Unmaintained crates pulled in transitively via pinned genpdf/printpdf
    # versions (= pins); no upgrade is available until upstream updates.
    "RUSTSEC-2020-0020", # stb_truetype
    "RUSTSEC-2020-0056", # stdweb
    "RUSTSEC-2020-0144", # lzw
    "RUSTSEC-2021-0140", # rusttype
    "RUSTSEC-2021-0153", # encoding
    "RUSTSEC-2025-0056", # adler
    # lopdf 0.26 (pinned by genpdf/printpdf): the flaw is in `load_mem` et al.
    # (parsing untrusted PDFs); abstract only ever *writes* PDFs, never parses.
    "RUSTSEC-2026-0187", # lopdf
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "0BSD",
    "NCSA",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
